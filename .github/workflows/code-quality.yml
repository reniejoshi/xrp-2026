name: Code Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]

jobs:
  header-check:
    name: Check File Headers
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check MIT License headers
      run: |
        HEADER_PATTERN="MIT License"
        COPYRIGHT_PATTERN="Copyright (c) 2026 Bear Metal"
        MISSING_HEADERS=()

        while IFS= read -r file; do
          # Check first 5 lines for MIT License header
          if ! head -n 5 "$file" | grep -q "$HEADER_PATTERN"; then
            MISSING_HEADERS+=("$file")
          elif ! head -n 5 "$file" | grep -q "$COPYRIGHT_PATTERN"; then
            MISSING_HEADERS+=("$file")
          fi
        done < <(find src -name "*.java" -type f)

        if [ ${#MISSING_HEADERS[@]} -gt 0 ]; then
          echo "::error::The following files are missing the MIT License header:"
          for file in "${MISSING_HEADERS[@]}"; do
            echo "  - $file"
          done
          echo ""
          echo "Expected header format:"
          echo "/*"
          echo " * MIT License"
          echo " *"
          echo " * Copyright (c) 2026 Bear Metal"
          echo " * ..."
          echo " */"
          exit 1
        fi

        echo "All Java files have proper MIT License headers."

  warning-check:
    name: Check Compiler Warnings
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with warnings as errors
      run: ./gradlew build -PwarningsAsErrors=true

  static-analysis:
    name: Static Analysis (PMD & SpotBugs)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run PMD
      run: ./gradlew pmdMain

    - name: Run SpotBugs
      run: ./gradlew spotbugsMain

    - name: Upload analysis reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: static-analysis-reports
        path: |
          build/reports/pmd/
          build/reports/spotbugs/
