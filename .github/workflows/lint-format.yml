name: Lint and Format

on:
  push:

jobs:
  spotless:
    name: "Spotless Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Run Spotless Check
        run: ./gradlew spotlessCheck